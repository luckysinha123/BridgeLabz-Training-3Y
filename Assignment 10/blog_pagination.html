<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="blog_pagination.css">
</head>
<body class="bg-light">
    
    <div class="container py-5">
        <h2 class="text-center mb-5">Blog Posts Navigation</h2>

        <!-- Placeholder for Blog Content -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-8 text-center">
                <p class="text-muted">Imagine a long list of interesting blog posts right here...</p>
            </div>
        </div>

        <!-- Centered Pagination Component -->
        <nav aria-label="Blog post pagination" class="mb-4">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
                </li>
                <li class="page-item active" aria-current="page">
                    <a class="page-link" href="#">1</a>
                </li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>

        <!-- Simple Pager below -->
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-outline-secondary px-4">&larr; Older Posts</button>
            <button class="btn btn-outline-secondary px-4 disabled">Newer Posts &rarr;</button>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
