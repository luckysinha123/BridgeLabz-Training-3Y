<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal_portfolio_basics.css">
</head>
<body class="bg-light text-dark">
    <!-- Header with margin, padding, text-center -->
    <header class="text-center p-5 mt-4 mb-3 bg-white shadow-sm rounded container">
        <h1 class="fw-bold">Jane Doe</h1>
        <p class="lead text-muted">Creative Web Developer & Designer</p>
    </header>

    <main class="container text-center">
        <section class="row justify-content-center mb-5">
            <div class="col-md-6">
                <!-- Profile Image -->
                <img src="https://picsum.photos/250/250" alt="Jane Doe" class="img-fluid rounded-circle mb-4 shadow border border-3 border-white">
                
                <!-- Buttons -->
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mb-5">
                    <button type="button" class="btn btn-primary btn-lg px-4 gap-3">Hire Me</button>
                    <button type="button" class="btn btn-outline-secondary btn-lg px-4">Download CV</button>
                </div>

                <!-- Contact Form -->
                <div class="card shadow-sm text-start">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center mb-4">Contact Me</h4>
                        <form>
                            <div class="mb-3">
                                <label for="nameInput" class="form-label">Name</label>
                                <input type="text" class="form-control" id="nameInput" placeholder="Your Name">
                            </div>
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                            </div>
                            <div class="mb-3">
                                <label for="messageTextarea" class="form-label">Message</label>
                                <textarea class="form-control" id="messageTextarea" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center p-4 bg-white mt-auto">
        <p class="mb-0 text-muted">Assignment 10 - Question 2</p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
