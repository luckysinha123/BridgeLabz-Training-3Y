<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <!-- Creative combination of inline formatting elements -->
    <p>
        I am <strong>passionate</strong> about technology and <em>curious</em> about cybersecurity.
        <mark>Learning never stops!</mark><br>
        <small>This is a simple HTML formatting demonstration.</small>
    </p>
</body>
</html>
