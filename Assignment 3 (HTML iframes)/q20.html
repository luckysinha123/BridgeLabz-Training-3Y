<!DOCTYPE html>
<html>
<head>
    <!-- <title> defines the title of the document that appears in the browser tab -->
    <title>Question 20 - Head Elements</title>
    
    <!-- <meta charset> specifies the character encoding for the HTML document -->
    <meta charset="UTF-8">
    
    <!-- <meta description> provides a short description of the page for search engines -->
    <meta name="description" content="This is a webpage demonstrating important head elements.">
    
    <!-- <meta author> specifies the author of the document -->
    <meta name="author" content="Student">
    
    <!-- <base> specifies the base URL for all relative URLs in a document -->
    <base href="https://www.example.com/" target="_blank">
    
    <!-- <link> is used to link to external resources, such as a favicon or a stylesheet -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- <style> is used to define internal CSS styles for the document -->
    <style>
        /* CSS can be placed here */
    </style>
    
    <!-- <script> is used to embed or reference executable code, like JavaScript -->
    <script>
        // JavaScript can be placed here
    </script>
</head>
<body>
    <!-- Body content -->
    <p>This page demonstrates various tags that can be used in the head section.</p>
</body>
</html>
