<!DOCTYPE html>
<html>
<head>
    <title>Question 9 - File Upload Form</title>
</head>
<body>
    <!-- File Upload Form -->
    <h2>Upload an Image</h2>
    <form action="#">
        <label for="file_upload">Select image:</label>
        <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png"><br><br>
        
        <!-- Note about allowed file types -->
        <p>Note: Only .jpg and .png files are allowed.</p>
        
        <input type="submit" value="Upload">
    </form>
</body>
</html>
