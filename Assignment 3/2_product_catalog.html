<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Product Catalog</h1>
    
    <!-- Table listing products -->
    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
            <th>Image</th>
        </tr>
        <tr>
            <td>Wireless Mouse</td>
            <td>A smooth and responsive wireless mouse.</td>
            <td>$25.00</td>
            <td>In Stock</td>
            <td><img src="mouse.jpg" alt="Wireless Mouse" width="100"></td>
        </tr>
        <tr>
            <!-- Using rowspan for a shared description across two variants -->
            <td rowspan="2">Mechanical Keyboard</td>
            <td>Blue Switches, Clicky</td>
            <td>$75.00</td>
            <td>Out of Stock</td>
            <td><img src="keyboard_blue.jpg" alt="Keyboard Blue" width="100"></td>
        </tr>
        <tr>
            <td>Red Switches, Linear</td>
            <td>$80.00</td>
            <td>In Stock</td>
            <td><img src="keyboard_red.jpg" alt="Keyboard Red" width="100"></td>
        </tr>
        <tr>
            <td colspan="5" align="center">More products coming soon!</td>
        </tr>
    </table>
</body>
</html>
