<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report Page</title>
</head>
<body>
    <!-- School Name -->
    <h1>Springfield High School</h1>

    <h2>Student Report Card: Bart Simpson</h2>

    <!-- Marks Table -->
    <table border="1">
        <tr>
            <th title="Subject Name">Subject</th>
            <th title="Marks obtained out of 100">Marks</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>90</td>
        </tr>
        <tr>
            <td>English</td>
            <td>78</td>
        </tr>
        <tr>
            <td>History</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
        </tr>
        
        <!-- Total and Percentage -->
        <tr>
            <td rowspan="2"><b>Overall Performance</b></td>
            <td><b>Total: 436 / 500</b></td>
        </tr>
        <tr>
            <td><b>Percentage: 87.2%</b></td>
        </tr>
    </table>
</body>
</html>
