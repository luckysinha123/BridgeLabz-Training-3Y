<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 7 - Contact Page with Form</title>
  <link rel="stylesheet" href="q7_contact.css">
</head>
<body>

  <!-- Fullscreen Centered Container -->
  <main class="page-wrapper">
    
    <!-- Contact Card Container -->
    <div class="contact-card">
      
      <!-- Form Header -->
      <header class="form-header">
        <h1>Get In Touch</h1>
        <p>Fill out the form below and we will get back to you shortly.</p>
      </header>

      <!-- Semantic Contact Form -->
      <form class="contact-form" action="#" method="POST">
        
        <!-- Field 1: Name -->
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
        </div>

        <!-- Field 2: Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

        <!-- Field 3: Subject -->
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Project Inquiry / Feedback" required>
        </div>

        <!-- Field 4: Message -->
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Send Message</button>

      </form>

    </div>

  </main>

  <!-- Page Footer -->
  <footer class="footer">
    <p>&copy; 2026 Contact Hub | Assignment 5 - Question 7</p>
  </footer>

</body>
</html>
