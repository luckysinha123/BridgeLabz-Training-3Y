<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - CSS Loading Animation</title>
    <link rel="stylesheet" href="q7_loader.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="animation-wrapper">
        <div class="loader-card">
            <h2>System Processing</h2>
            <p>Please wait while we synthesize your layout assets...</p>
            
            <!-- Requirement: Loading animation using only div elements -->
            <div class="loader-container">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
