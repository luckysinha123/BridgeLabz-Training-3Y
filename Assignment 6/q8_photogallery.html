<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Grid Photo Gallery</title>
    <link rel="stylesheet" href="q8_photogallery.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="gallery-wrapper">
        <header class="gallery-head">
            <h1>Nature & Architecture Showcase</h1>
            <p>Auto-responsive grid gallery with smooth image zoom transitions</p>
        </header>

        <main class="photo-grid">
            <!-- Figure 1 -->
            <figure class="gallery-item">
                <div class="img-container">
                    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                        <rect width="400" height="300" fill="#1e293b"/>
                        <path d="M0 250 L120 150 L220 230 L320 120 L400 220 L400 300 L0 300 Z" fill="#334155"/>
                        <path d="M100 270 L200 180 L300 240 L400 160 L400 300 L100 300 Z" fill="#475569"/>
                        <circle cx="320" cy="80" r="30" fill="#f59e0b"/>
                    </svg>
                </div>
                <figcaption>Mountain Peak Sunrise</figcaption>
            </figure>

            <!-- Figure 2 -->
            <figure class="gallery-item">
                <div class="img-container">
                    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                        <rect width="400" height="300" fill="#0f172a"/>
                        <circle cx="200" cy="150" r="100" fill="#0284c7" opacity="0.3"/>
                        <path d="M50 200 Q 200 80, 350 200" stroke="#38bdf8" stroke-width="8" fill="none"/>
                        <circle cx="200" cy="150" r="40" fill="#38bdf8"/>
                    </svg>
                </div>
                <figcaption>Abstract Digital Waves</figcaption>
            </figure>

            <!-- Figure 3 -->
            <figure class="gallery-item">
                <div class="img-container">
                    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                        <rect width="400" height="300" fill="#1e1b4b"/>
                        <polygon points="200,40 320,260 80,260" fill="#6366f1" opacity="0.8"/>
                        <polygon points="200,90 280,240 120,240" fill="#a5b4fc"/>
                    </svg>
                </div>
                <figcaption>Geometric Architectural Tower</figcaption>
            </figure>

            <!-- Figure 4 -->
            <figure class="gallery-item">
                <div class="img-container">
                    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                        <rect width="400" height="300" fill="#064e3b"/>
                        <path d="M0 300 C 150 200, 250 100, 400 0 L 400 300 Z" fill="#10b981"/>
                        <circle cx="100" cy="100" r="45" fill="#a7f3d0" opacity="0.5"/>
                    </svg>
                </div>
                <figcaption>Emerald Forest Canopy</figcaption>
            </figure>

            <!-- Figure 5 -->
            <figure class="gallery-item">
                <div class="img-container">
                    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                        <rect width="400" height="300" fill="#701a75"/>
                        <rect x="50" y="50" width="300" height="200" rx="20" fill="#c026d3" opacity="0.5"/>
                        <circle cx="200" cy="150" r="60" fill="#f0abfc"/>
                    </svg>
                </div>
                <figcaption>Neon Cyberpunk Vista</figcaption>
            </figure>

            <!-- Figure 6 -->
            <figure class="gallery-item">
                <div class="img-container">
                    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                        <rect width="400" height="300" fill="#7c2d12"/>
                        <circle cx="120" cy="120" r="70" fill="#ea580c"/>
                        <circle cx="280" cy="180" r="90" fill="#f97316" opacity="0.7"/>
                    </svg>
                </div>
                <figcaption>Desert Canyon Sunset</figcaption>
            </figure>
        </main>
    </div>
</body>
</html>
