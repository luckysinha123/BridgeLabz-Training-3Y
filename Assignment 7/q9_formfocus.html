<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Outline & Focus Styling Form</title>
    <link rel="stylesheet" href="q9_formfocus.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-wrapper">
        <header class="form-header">
            <h1>Outline & Focus Customization</h1>
            <p>Click into each form control to trigger custom focus outlines with offset spacing</p>
        </header>

        <form class="styled-form" action="#" method="post" onsubmit="return false;">
            <!-- Form Group 1: Solid Outline + Offset -->
            <div class="form-group">
                <label for="name">Full Name (Solid Outline with 4px Offset)</label>
                <input type="text" id="name" class="input-solid" placeholder="Click to see solid outline offset...">
            </div>

            <!-- Form Group 2: Dashed Outline + Offset -->
            <div class="form-group">
                <label for="email">Email Address (Dashed Outline with 3px Offset)</label>
                <input type="email" id="email" class="input-dashed" placeholder="Click to see dashed outline offset...">
            </div>

            <!-- Form Group 3: Double Outline + Offset Textarea -->
            <div class="form-group">
                <label for="message">Your Message (Double Outline with 5px Offset)</label>
                <textarea id="message" class="textarea-double" rows="4" placeholder="Click to see double outline offset..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
