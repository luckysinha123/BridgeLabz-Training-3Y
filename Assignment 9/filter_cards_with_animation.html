<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter_cards_with_animation.css">
</head>
<body>
    <header>
        <h1>Animated Filter Cards</h1>
    </header>
    <main>
        <section class="cards-container">
            <div class="profile-card">
                <img src="https://picsum.photos/300/300?random=7" alt="Profile 1" class="profile-img grayscale">
                <h2>Alice Doe</h2>
                <p>Web Developer</p>
            </div>
            <div class="profile-card">
                <img src="https://picsum.photos/300/300?random=8" alt="Profile 2" class="profile-img sepia">
                <h2>Bob Smith</h2>
                <p>Graphic Designer</p>
            </div>
            <div class="profile-card">
                <img src="https://picsum.photos/300/300?random=9" alt="Profile 3" class="profile-img grayscale">
                <h2>Charlie Brown</h2>
                <p>UX/UI Specialist</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Assignment 9 - Question 5</p>
    </footer>
</body>
</html>
