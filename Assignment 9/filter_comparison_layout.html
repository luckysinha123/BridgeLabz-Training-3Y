<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
    <header>
        <h1>Filter Comparison Layout</h1>
    </header>
    <main>
        <section class="comparison-container">
            <figure class="comparison-item">
                <img src="https://picsum.photos/500/400?random=14" alt="Original Image">
                <figcaption>Original Image (No Filter)</figcaption>
            </figure>
            <figure class="comparison-item filtered-item">
                <img src="https://picsum.photos/500/400?random=14" alt="Filtered Image" class="applied-filter">
                <figcaption>Filtered Image (High Contrast & Sepia) - Hover to remove</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>Assignment 9 - Question 8</p>
    </footer>
</body>
</html>
