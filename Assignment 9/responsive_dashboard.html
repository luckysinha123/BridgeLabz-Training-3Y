<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <link rel="stylesheet" href="responsive_dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <header class="dash-header">
            <h1>Dashboard</h1>
        </header>
        
        <aside class="dash-sidebar">
            <nav>
                <a href="#">Overview</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
            </nav>
        </aside>
        
        <main class="dash-content">
            <div class="cards-grid">
                <div class="dash-card">
                    <h2>Filters</h2>
                    <p>Visual effects applied to elements.</p>
                </div>
                <div class="dash-card">
                    <h2>Typography</h2>
                    <p>Fluid scaling with clamp().</p>
                </div>
                <div class="dash-card">
                    <h2>Media Queries</h2>
                    <p>Responsive breakpoints.</p>
                </div>
                <div class="dash-card">
                    <h2>Cheat Sheet Links</h2>
                    <p>Quick references for CSS.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
