<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>
    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=1" alt="Blur Filter" class="filter-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=2" alt="Grayscale Filter" class="filter-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=3" alt="Sepia Filter" class="filter-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=4" alt="Brightness Filter" class="filter-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=5" alt="Contrast Filter" class="filter-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=6" alt="Hue-Rotate Filter" class="filter-hue-rotate">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>Assignment 9 - Question 1</p>
    </footer>
</body>
</html>
