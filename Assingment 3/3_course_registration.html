<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>
    <h1>Course Registration</h1>

    <!-- Course Registration Form -->
    <form action="#" method="POST">
        <!-- Fieldset to group form fields -->
        <fieldset>
            <legend>Student Information</legend>
            
            <!-- Input fields for name and email -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <!-- Select dropdown for course selection -->
            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="html">HTML Basics</option>
                <option value="css">CSS Styling</option>
                <option value="js">JavaScript Fundamentals</option>
            </select><br><br>
            
            <input type="submit" value="Register">
        </fieldset>
    </form>

    <br>

    <!-- Table showing available course schedules -->
    <table border="1">
        <caption>Available Course Schedules</caption>
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Dr. Smith</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>02:00 PM - 04:00 PM</td>
            <td>Prof. Johnson</td>
        </tr>
    </table>
</body>
</html>
