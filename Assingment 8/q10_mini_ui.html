<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10: Mini User Interface</title>
    <link rel="stylesheet" href="q10_mini_ui.css">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <h1>Mini UI Layout</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
            </nav>
        </header>
        
        <main class="app-main">
            <div class="card">
                <div class="card-image">
                    <img src="https://picsum.photos/400/200" alt="Card Header">
                </div>
                <div class="card-content">
                    <h2>Sign Up</h2>
                    <p>Join us today to get started.</p>
                    <form class="ui-form">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Enter email">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-outline">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        
        <footer class="app-footer">
            <p>&copy; 2023 Mini UI Layout. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
