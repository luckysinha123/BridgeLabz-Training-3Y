<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2: Tooltips</title>
    <link rel="stylesheet" href="q2_tooltip.css">
</head>
<body>
    <header>
        <h1>Tooltip Demonstration</h1>
    </header>
    <main class="tooltip-container">
        <div class="tooltip-wrapper">
            <span class="hover-element">Hover Word</span>
            <div class="tooltip">This is a word tooltip</div>
        </div>
        <div class="tooltip-wrapper">
            <button class="hover-element btn">Hover Button</button>
            <div class="tooltip">This is a button tooltip</div>
        </div>
        <div class="tooltip-wrapper">
            <span class="hover-element icon">ℹ️</span>
            <div class="tooltip">This is an icon tooltip</div>
        </div>
    </main>
    <footer>
        <p>Assignment 8 - Question 2</p>
    </footer>
</body>
</html>
