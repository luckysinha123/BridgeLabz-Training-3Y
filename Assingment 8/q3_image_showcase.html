<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3: Image Showcase</title>
    <link rel="stylesheet" href="q3_image_showcase.css">
</head>
<body>
    <header>
        <h1>Image Showcase Layout</h1>
    </header>
    <main>
        <div class="gallery">
            <figure class="gallery-item">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=1" alt="Showcase 1">
                    <div class="overlay"></div>
                </div>
                <figcaption>Breathtaking Landscape</figcaption>
            </figure>
            <figure class="gallery-item">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=2" alt="Showcase 2">
                    <div class="overlay"></div>
                </div>
                <figcaption>Urban Architecture</figcaption>
            </figure>
            <figure class="gallery-item">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=3" alt="Showcase 3">
                    <div class="overlay"></div>
                </div>
                <figcaption>Serene Nature</figcaption>
            </figure>
            <figure class="gallery-item">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=4" alt="Showcase 4">
                    <div class="overlay"></div>
                </div>
                <figcaption>Modern Technology</figcaption>
            </figure>
            <figure class="gallery-item">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=5" alt="Showcase 5">
                    <div class="overlay"></div>
                </div>
                <figcaption>Abstract Art</figcaption>
            </figure>
            <figure class="gallery-item">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=6" alt="Showcase 6">
                    <div class="overlay"></div>
                </div>
                <figcaption>Vintage Collection</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>Assignment 8 - Question 3</p>
    </footer>
</body>
</html>
