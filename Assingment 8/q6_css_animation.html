<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6: CSS Animations</title>
    <link rel="stylesheet" href="q6_css_animation.css">
</head>
<body>
    <header>
        <h1>CSS Animation Demonstration</h1>
    </header>
    <main class="animation-container">
        <!-- Animation 1: Moving Box -->
        <div class="anim-wrapper">
            <div class="moving-box">Moving Box</div>
            <p>Moving back and forth</p>
        </div>

        <!-- Animation 2: Bouncing Ball -->
        <div class="anim-wrapper">
            <div class="bouncing-ball"></div>
            <p>Bouncing Ball</p>
        </div>

        <!-- Animation 3: Color Changing Text -->
        <div class="anim-wrapper">
            <h2 class="color-text">Rainbow Text</h2>
            <p>Color fading</p>
        </div>
    </main>
    <footer>
        <p>Assignment 8 - Question 6</p>
    </footer>
</body>
</html>
