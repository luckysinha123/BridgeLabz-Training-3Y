<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7: UI Components</title>
    <link rel="stylesheet" href="q7_ui_components.css">
</head>
<body>
    <header>
        <h1>UI Components</h1>
    </header>
    <main class="ui-wrapper">
        <section class="ui-card">
            <h2>Search Settings</h2>
            
            <div class="search-bar">
                <input type="text" placeholder="Search components..." class="ui-input">
                <button class="ui-btn primary">Search</button>
            </div>

            <div class="dropdown-wrapper">
                <label for="options">Select Option:</label>
                <select id="options" class="ui-select">
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                </select>
            </div>

            <div class="action-buttons">
                <button class="ui-btn secondary">Cancel</button>
                <button class="ui-btn primary">Save Changes</button>
            </div>
        </section>
    </main>
    <footer>
        <p>Assignment 8 - Question 7</p>
    </footer>
</body>
</html>
